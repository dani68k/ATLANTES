<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101923">
  <link rel="icon" type="image/png" href="./favicon.png">
  <title>AS7265x CSV Manager</title>
  <style>
    @font-face {
      font-family: "Font Awesome";
      src: url("./fonts/fa-solid-900.woff2") format("woff2");
      font-style: normal;
      font-weight: 900;
      font-display: block;
    }

    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101923;
      color: #e7eef5;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 12% 0%, #1b3741 0, transparent 38rem),
        #101923;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      column-gap: 24px;
      row-gap: 12px;
      margin-bottom: 28px;
    }

    .version-badge {
      position: fixed;
      z-index: 10;
      top: 16px;
      right: max(16px, calc((100vw - 1120px) / 2));
      padding: 5px 9px;
      border: 1px solid #405362;
      border-radius: 999px;
      background: rgb(21 32 43 / 92%);
      color: #a9b8c6;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .brand-name {
      display: grid;
      gap: 2px;
      color: #e7eef5;
      font-size: 0.83rem;
      font-weight: 800;
      line-height: 1.05;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 2.6rem);
      letter-spacing: -0.045em;
    }

    .intro {
      max-width: 650px;
      margin: 12px 0 0;
      color: #a9b8c6;
      line-height: 1.6;
    }

    .panel {
      border: 1px solid #293946;
      border-radius: 18px;
      background: rgb(21 32 43 / 92%);
      box-shadow: 0 18px 55px rgb(0 0 0 / 18%);
    }

    .connection {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 18px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 17px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: #108cf0;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, transform 120ms ease;
    }

    .button-icon {
      font-family: "Font Awesome";
      font-size: 1rem;
      font-weight: 900;
      line-height: 1;
    }

    button:not(:disabled):active {
      background: #00ff5e;
      color: #0d141b;
      transform: translateY(1px);
    }

    button:focus-visible {
      outline: 3px solid #96f0dc;
      outline-offset: 3px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .dialog-backdrop {
      width: min(440px, calc(100% - 32px));
      max-width: none;
      padding: 0;
      border: 1px solid #405362;
      border-radius: 18px;
      background: #15202b;
      color: #e7eef5;
      box-shadow: 0 24px 80px rgb(0 0 0 / 55%);
    }

    .dialog-backdrop::backdrop {
      background: rgb(5 10 16 / 76%);
      backdrop-filter: blur(3px);
    }

    .dialog-content {
      padding: 24px;
    }

    .dialog-content h2 {
      margin: 0;
      font-size: 1.15rem;
    }

    .dialog-message {
      margin: 12px 0 0;
      color: #a9b8c6;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .status {
      flex: 1 1 250px;
      min-width: 0;
      color: #a9b8c6;
      line-height: 1.45;
    }

    .status[data-kind="success"] {
      color: #83e9c4;
    }

    .status[data-kind="error"] {
      color: #ff9b9b;
    }

    .status[data-kind="working"] {
      color: #f1d28b;
    }

    .file-panel {
      margin-top: 18px;
      overflow: hidden;
    }

    .file-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px;
      border-bottom: 1px solid #293946;
    }

    .file-heading h2 {
      margin: 0;
      font-size: 1rem;
    }

    .file-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .file-meta {
      margin: 5px 0 0;
      color: #91a3b2;
      font-size: 0.86rem;
    }

    .table-scroll {
      max-height: min(62vh, 680px);
      overflow: auto;
    }

    .csv-table {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      color: #d2e3ed;
      font: 0.82rem/1.4 "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      white-space: nowrap;
    }

    .csv-table th,
    .csv-table td {
      max-width: 280px;
      overflow: hidden;
      padding: 10px 12px;
      border-bottom: 1px solid #293946;
      text-align: left;
      text-overflow: ellipsis;
    }

    .csv-table thead th {
      position: sticky;
      z-index: 1;
      top: 0;
      background: #202e3a;
      color: #a9b8c6;
      font: 700 0.72rem/1.4 Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .csv-table tbody tr {
      cursor: pointer;
    }

    .csv-table tbody tr:hover {
      background: #1c3038;
    }

    .csv-table tbody tr[aria-selected="true"] {
      background: #17463f;
      box-shadow: inset 3px 0 #70e0c6;
    }

    .csv-table .select-column {
      position: sticky;
      z-index: 2;
      left: 0;
      width: 62px;
      min-width: 62px;
      background: #15202b;
      text-align: center;
    }

    .csv-table thead .select-column {
      z-index: 3;
      background: #202e3a;
    }

    .select-all-control {
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
    }

    .csv-table input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      appearance: none;
      border: 2px solid #8294a3;
      border-radius: 50%;
      background: #15202b;
      cursor: pointer;
    }

    .csv-table input[type="checkbox"]:checked {
      border-color: #70e0c6;
      background: radial-gradient(circle, #70e0c6 48%, transparent 54%);
    }

    .csv-table input[type="checkbox"]:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .csv-table tr[aria-selected="true"] .select-column {
      background: #17463f;
    }

    .csv-table input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: #70e0c6;
      cursor: pointer;
    }

    .spectrum-panel {
      padding: 20px 18px;
      border-top: 1px solid #293946;
    }

    .spectrum-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .spectrum-heading h2 {
      margin: 0;
      font-size: 1rem;
    }

    .spectrum-record {
      margin: 6px 0 0;
      color: #91a3b2;
      font-size: 0.86rem;
    }

    .peak-summary {
      color: #91a3b2;
      text-align: right;
    }

    .peak-channel {
      display: block;
      margin-bottom: 4px;
      color: #70e0c6;
      font-weight: 700;
    }

    .peak-value {
      color: #e7eef5;
      font-size: 1.15rem;
      font-weight: 750;
    }

    .spectrum-scroll {
      overflow-x: auto;
      border: 1px solid #293946;
      border-radius: 12px;
      background: #111c26;
    }

    .spectrum-chart {
      display: grid;
      grid-template-columns: repeat(18, minmax(38px, 1fr));
      gap: 2px;
      min-width: 746px;
      height: 270px;
      padding: 18px 14px 12px;
    }

    .spectrum-column {
      display: grid;
      grid-template-rows: 22px 1fr 22px;
      min-width: 0;
      text-align: center;
    }

    .spectrum-raw-value,
    .spectrum-wavelength {
      overflow: hidden;
      color: #91a3b2;
      font: 0.7rem/22px "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spectrum-bar-track {
      display: flex;
      height: 100%;
      align-items: flex-end;
      justify-content: center;
      border-bottom: 1px solid #405362;
      background: repeating-linear-gradient(
        to top,
        transparent 0,
        transparent calc(20% - 1px),
        rgb(128 124 124 / 55%) calc(20% - 1px),
        rgb(128 124 124 / 55%) 20%
      );
    }

    .spectrum-bar {
      width: 84%;
      border-radius: 5px 5px 0 0;
    }

    .spectrum-error {
      margin: 0;
      color: #ff9b9b;
      line-height: 1.5;
    }

    .setup-values {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .setup-value {
      padding: 12px;
      border: 1px solid #293946;
      border-radius: 10px;
      background: #182631;
    }

    .setup-value dt {
      margin-bottom: 5px;
      color: #91a3b2;
      font-size: 0.75rem;
    }

    .setup-value dd {
      margin: 0;
      color: #e7eef5;
      font-weight: 700;
    }

    .instructions {
      margin: 18px 4px 0;
      color: #8294a3;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    code {
      color: #b7eadc;
    }

    @media (max-width: 560px) {
      main {
        padding: 30px 0;
      }

      .connection {
        align-items: stretch;
      }

      .connection button {
        flex: 1 1 130px;
      }

      .status {
        flex-basis: 100%;
      }

      .file-heading {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <span class="version-badge" id="versionBadge" aria-label="Firmware version">v—</span>
  <main>
    <header>
      <div class="brand" aria-label="Spectrometer AS7265x, 18 bands">
        <img class="brand-icon" src="./favicon.png" alt="">
        <div class="brand-name">
          <span>SPECTROMETER</span>
          <span>AS7265x | 18 bands</span>
        </div>
      </div>
      <h1>CSV Manager</h1>
    </header>

    <section class="panel connection" aria-label="Bluetooth connection">
      <button class="primary" id="connectButton" type="button"><span class="button-icon" aria-hidden="true">&#xf0c1;</span>Connect device</button>
      <button class="primary" id="requestButton" type="button" disabled><span class="button-icon" aria-hidden="true">&#xf15c;</span>Get CSV</button>
      <button class="secondary" id="downloadButton" type="button" disabled><span class="button-icon" aria-hidden="true">&#xf019;</span>Download CSV</button>
      <button class="secondary" id="disconnectButton" type="button" disabled><span class="button-icon" aria-hidden="true">&#xf127;</span>Disconnect</button>
      <div class="status" id="status" role="status" aria-live="polite" data-kind="neutral">Ready to connect.</div>
    </section>

    <section class="panel file-panel" aria-labelledby="fileTitle">
      <div class="file-heading">
        <div>
          <h2 id="fileTitle">data.csv</h2>
          <p class="file-meta" id="fileMeta">No file received yet.</p>
        </div>
        <div class="file-actions">
          <button class="secondary" id="deleteRowButton" type="button" disabled><span class="button-icon" aria-hidden="true">&#xf1f8;</span>Delete selected row</button>
        </div>
      </div>
      <div class="table-scroll" id="csvTableContainer" hidden>
        <table class="csv-table" id="csvTable" aria-label="CSV records"></table>
      </div>
      <section class="spectrum-panel" id="spectrumPanel" aria-labelledby="spectrumTitle" hidden>
        <div class="spectrum-heading">
          <div>
            <h2 id="spectrumTitle">Selected spectrum</h2>
            <p class="spectrum-record" id="spectrumRecord"></p>
          </div>
          <div class="peak-summary" id="peakSummary"></div>
        </div>
        <div id="spectrumContent">
          <div class="spectrum-scroll">
            <div class="spectrum-chart" id="spectrumChart" role="img" aria-label="Raw spectrum histogram"></div>
          </div>
          <dl class="setup-values" id="setupValues"></dl>
        </div>
        <p class="spectrum-error" id="spectrumError" role="alert" hidden></p>
      </section>
    </section>

  </main>

  <dialog class="dialog-backdrop" id="confirmationDialog" aria-labelledby="confirmationTitle" aria-describedby="confirmationMessage">
    <form class="dialog-content" method="dialog">
      <h2 id="confirmationTitle"></h2>
      <p class="dialog-message" id="confirmationMessage"></p>
      <div class="dialog-actions">
        <button class="secondary" id="cancelConfirmation" value="cancel">Cancel</button>
        <button class="danger" id="acceptConfirmation" value="confirm">Delete</button>
      </div>
    </form>
  </dialog>

  <script>
    "use strict";

    const DEVICE_NAME = "AS7265x CSV";
    const SERVICE_UUID = "9c5e1000-7e5a-4f2d-9a91-30e52e7b1b01";
    const CONTROL_UUID = "9c5e1001-7e5a-4f2d-9a91-30e52e7b1b01";
    const DATA_UUID = "9c5e1002-7e5a-4f2d-9a91-30e52e7b1b01";
    const STATUS_UUID = "9c5e1003-7e5a-4f2d-9a91-30e52e7b1b01";
    const TRANSFER_TIMEOUT_MS = 120000;
    const CHANNEL_COLORS = {
      410: "#6a00ff",
      435: "#4b00ff",
      460: "#0055ff",
      485: "#009aff",
      510: "#00d4b0",
      535: "#00c850",
      560: "#58d000",
      585: "#b8d000",
      610: "#ffb000",
      645: "#ff4a00",
      680: "#e03000",
      705: "#b02000",
      730: "#7a1a00",
      760: "#6e1608",
      810: "#5a1018",
      860: "#4a1028",
      900: "#3a1634",
      940: "#2c1e38"
    };

    const connectButton = document.querySelector("#connectButton");
    const requestButton = document.querySelector("#requestButton");
    const downloadButton = document.querySelector("#downloadButton");
    const disconnectButton = document.querySelector("#disconnectButton");
    const deleteRowButton = document.querySelector("#deleteRowButton");
    const statusElement = document.querySelector("#status");
    const fileMeta = document.querySelector("#fileMeta");
    const csvTableContainer = document.querySelector("#csvTableContainer");
    const csvTable = document.querySelector("#csvTable");
    const spectrumPanel = document.querySelector("#spectrumPanel");
    const spectrumRecord = document.querySelector("#spectrumRecord");
    const peakSummary = document.querySelector("#peakSummary");
    const spectrumContent = document.querySelector("#spectrumContent");
    const spectrumChart = document.querySelector("#spectrumChart");
    const setupValues = document.querySelector("#setupValues");
    const spectrumError = document.querySelector("#spectrumError");
    const versionBadge = document.querySelector("#versionBadge");
    const confirmationDialog = document.querySelector("#confirmationDialog");
    const confirmationTitle = document.querySelector("#confirmationTitle");
    const confirmationMessage = document.querySelector("#confirmationMessage");

    let device = null;
    let controlCharacteristic = null;
    let dataCharacteristic = null;
    let statusCharacteristic = null;
    let transferChunks = [];
    let receivedBytes = 0;
    let transferTimer = null;
    let transferPending = false;
    let deleteTimer = null;
    let deletePending = false;
    let csvContents = null;
    let selectedRecordIndex = null;
    let selectedSampleId = null;
    let selectedAllRecords = false;
    let csvHeaders = [];
    let csvRecords = [];

    function setStatus(message, kind = "neutral") {
      statusElement.textContent = message;
      statusElement.dataset.kind = kind;
    }

    function updateActionButtons() {
      const connected = Boolean(device?.gatt.connected && controlCharacteristic);
      requestButton.disabled = !connected || transferPending || deletePending;
      deleteRowButton.disabled = !connected || transferPending || deletePending ||
        (!selectedAllRecords && (selectedRecordIndex === null || selectedSampleId === null));
    }

    function clearSelection() {
      selectedRecordIndex = null;
      selectedSampleId = null;
      selectedAllRecords = false;
      const selectAll = csvTable.querySelector("#selectAllRecords");
      if (selectAll) selectAll.checked = false;
      for (const row of csvTable.tBodies[0]?.rows ?? []) {
        row.setAttribute("aria-selected", "false");
        row.querySelector('input[type="radio"]').checked = false;
      }
      delete fileMeta.dataset.selectedRecord;
      spectrumPanel.hidden = true;
      updateActionButtons();
    }

    function clearTransfer() {
      clearTimeout(transferTimer);
      transferTimer = null;
      transferChunks = [];
      receivedBytes = 0;
      transferPending = false;
      updateActionButtons();
    }

    function confirmDestructiveAction(title, message, confirmLabel = "Delete") {
      confirmationTitle.textContent = title;
      confirmationMessage.textContent = message;
      document.querySelector("#acceptConfirmation").textContent = confirmLabel;
      confirmationDialog.returnValue = "cancel";
      confirmationDialog.showModal();
      return new Promise((resolve) => {
        confirmationDialog.addEventListener(
          "close",
          () => resolve(confirmationDialog.returnValue === "confirm"),
          { once: true }
        );
      });
    }

    function parseCsv(text) {
      if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;
      let quoteClosed = false;

      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        if (quoted) {
          if (character === '"') {
            if (text[index + 1] === '"') {
              field += '"';
              index += 1;
            } else {
              quoted = false;
              quoteClosed = true;
            }
          } else {
            field += character;
          }
          continue;
        }

        if (character === ",") {
          row.push(field);
          field = "";
          quoteClosed = false;
        } else if (character === "\n" || character === "\r") {
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
          quoteClosed = false;
          if (character === "\r" && text[index + 1] === "\n") index += 1;
        } else if (character === '"') {
          if (field.length !== 0 || quoteClosed) {
            throw new Error("Unexpected quote in CSV field.");
          }
          quoted = true;
        } else {
          if (quoteClosed) throw new Error("Unexpected text after quoted CSV field.");
          field += character;
        }
      }

      if (quoted) throw new Error("CSV contains an unterminated quoted field.");
      if (field.length > 0 || row.length > 0 || quoteClosed) {
        row.push(field);
        rows.push(row);
      }
      return rows;
    }

    function selectAllRecords(checkbox) {
      selectedAllRecords = checkbox.checked;
      selectedRecordIndex = null;
      selectedSampleId = null;
      for (const row of csvTable.tBodies[0].rows) {
        row.setAttribute("aria-selected", String(selectedAllRecords));
        row.querySelector('input[type="radio"]').checked = selectedAllRecords;
      }
      delete fileMeta.dataset.selectedRecord;
      spectrumPanel.hidden = true;
      updateActionButtons();
    }

    function selectRecord(index, rowElement, radio) {
      selectedAllRecords = false;
      const selectAll = csvTable.querySelector("#selectAllRecords");
      if (selectAll) selectAll.checked = false;
      selectedRecordIndex = index;
      const sampleIdColumn = csvHeaders.findIndex(
        (header) => header.toLowerCase() === "sample_id"
      );
      const sampleIdText = sampleIdColumn < 0 ? "" : csvRecords[index][sampleIdColumn];
      const sampleId = /^\d+$/.test(sampleIdText) ? Number(sampleIdText) : NaN;
      selectedSampleId = Number.isSafeInteger(sampleId) && sampleId <= 0xffffffff
        ? sampleId
        : null;
      for (const row of csvTable.tBodies[0].rows) {
        const selected = Number(row.dataset.recordIndex) === index;
        row.setAttribute("aria-selected", String(selected));
        row.querySelector('input[type="radio"]').checked = selected;
      }
      radio.checked = true;
      rowElement.setAttribute("aria-selected", "true");
      fileMeta.dataset.selectedRecord = String(index + 1);
      updateActionButtons();
      try {
        renderSpectrum(csvRecords[index], index);
      } catch (error) {
        spectrumPanel.hidden = false;
        spectrumContent.hidden = true;
        spectrumError.hidden = false;
        spectrumError.textContent = `Could not display the selected spectrum: ${error.message}`;
        setStatus(spectrumError.textContent, "error");
      }
      if (selectedSampleId === null) {
        setStatus("The selected row has no valid Sample_id and cannot be deleted.", "error");
      }
    }

    function renderSpectrum(record, recordIndex) {
      const rawColumns = csvHeaders
        .map((header, index) => ({ header, index }))
        .filter(({ header }) => /^raw\d+$/i.test(header));
      const calibratedColumns = new Map(
        csvHeaders
          .map((header, index) => ({ header, index }))
          .filter(({ header }) => /^cal\d+$/i.test(header))
          .map(({ header, index }) => [header.toLowerCase().slice(3), index])
      );
      if (rawColumns.length !== 18 || calibratedColumns.size !== 18) {
        throw new Error("Expected 18 raw and 18 calibrated spectrum channels.");
      }

      const integrationColumn = csvHeaders.findIndex(
        (header) => header.toLowerCase() === "integration time"
      );
      if (integrationColumn < 0 || record[integrationColumn].trim() === "") {
        throw new Error('Missing value for "Integration time".');
      }
      const integrationTimeMs = Number(record[integrationColumn]);
      if (!Number.isFinite(integrationTimeMs) || integrationTimeMs <= 0) {
        throw new Error('Invalid value for "Integration time".');
      }
      const integrationCycles = Math.round(integrationTimeMs / 5.56) - 1;
      const maxAdcValue = Math.max(
        1,
        Math.min(65535, (integrationCycles + 1) * 1024 - 1)
      );

      let maxRaw = 0;
      let maxCalibrated = 0;
      let calibratedMaxIndex = -1;
      const channels = rawColumns.map(({ header, index }, channelIndex) => {
        const wavelength = header.match(/\d+$/)[0];
        const raw = Number(record[index]);
        const calibratedIndex = calibratedColumns.get(wavelength);
        if (record[index].trim() === "" || calibratedIndex === undefined ||
            record[calibratedIndex].trim() === "") {
          throw new Error(`Missing spectrum data for ${wavelength} nm.`);
        }
        const calibrated = Number(record[calibratedIndex]);
        if (!Number.isFinite(raw) || !Number.isFinite(calibrated) || raw < 0) {
          throw new Error(`Invalid spectrum data for ${wavelength} nm.`);
        }
        if (!Object.hasOwn(CHANNEL_COLORS, wavelength)) {
          throw new Error(`No display color is defined for ${wavelength} nm.`);
        }
        if (raw > maxRaw) maxRaw = raw;
        if (calibrated > maxCalibrated) {
          maxCalibrated = calibrated;
          calibratedMaxIndex = channelIndex;
        }
        return { wavelength, raw };
      });

      const recordTitle = `Record ${recordIndex + 1}`;
      const sampleIdIndex = csvHeaders.findIndex((header) => header.toLowerCase() === "sample_id");
      const labelIndex = csvHeaders.findIndex((header) => header.toLowerCase() === "label");
      const details = [];
      if (sampleIdIndex >= 0) details.push(`ID ${record[sampleIdIndex]}`);
      if (labelIndex >= 0 && record[labelIndex] !== "") details.push(record[labelIndex]);
      spectrumRecord.textContent = details.length > 0
        ? `${recordTitle} · ${details.join(" · ")}`
        : recordTitle;

      if (calibratedMaxIndex >= 0) {
        const peak = channels[calibratedMaxIndex];
        const peakValue = maxCalibrated >= 65535 ? "BLINDED" : maxCalibrated.toFixed(1);
        peakSummary.replaceChildren();
        const channel = document.createElement("span");
        channel.className = "peak-channel";
        channel.textContent = `CH${calibratedMaxIndex + 1} · λ = ${peak.wavelength} nm`;
        const value = document.createElement("span");
        value.className = "peak-value";
        value.textContent = peakValue;
        peakSummary.append(channel, value);
      } else {
        peakSummary.textContent = "No positive calibrated peak";
      }

      spectrumChart.replaceChildren();
      channels.forEach(({ wavelength, raw }) => {
        const column = document.createElement("div");
        column.className = "spectrum-column";
        const rawValue = document.createElement("span");
        rawValue.className = "spectrum-raw-value";
        rawValue.textContent = String(raw);
        const track = document.createElement("div");
        track.className = "spectrum-bar-track";
        const bar = document.createElement("div");
        bar.className = "spectrum-bar";
        const barValue = Math.trunc((raw * 100) / maxAdcValue);
        bar.style.backgroundColor = CHANNEL_COLORS[wavelength];
        bar.style.height = `${Math.min(barValue, 100)}%`;
        bar.title = `${wavelength} nm: ${raw} raw (${barValue}%)`;
        track.append(bar);
        const wavelengthLabel = document.createElement("span");
        wavelengthLabel.className = "spectrum-wavelength";
        wavelengthLabel.textContent = wavelength;
        wavelengthLabel.style.color = barValue >= 99
          ? "#ff0000"
          : barValue >= 90
            ? "#ff8000"
            : raw === maxRaw
              ? "#00ff5e"
              : "#91a3b2";
        column.append(rawValue, track, wavelengthLabel);
        spectrumChart.append(column);
      });

      const setup = [
        ["Gain", "Gain", ""],
        ["Integration time", "Integration time", " ms"],
        ["Measurement time", "Measurement time", " s"],
        ["Temperature", "Temperature", " °C"]
      ];
      setupValues.replaceChildren();
      for (const [label, header, unit] of setup) {
        const item = document.createElement("div");
        item.className = "setup-value";
        const term = document.createElement("dt");
        term.textContent = label;
        const value = document.createElement("dd");
        const columnIndex = header === "Integration time"
          ? integrationColumn
          : csvHeaders.findIndex((column) => column.toLowerCase() === header.toLowerCase());
        if (columnIndex < 0 || record[columnIndex].trim() === "") {
          throw new Error(`Missing value for "${header}".`);
        }
        value.textContent = `${record[columnIndex]}${unit}`;
        item.append(term, value);
        setupValues.append(item);
      }

      spectrumContent.hidden = false;
      spectrumError.hidden = true;
      spectrumPanel.hidden = false;
    }

    function renderCsvTable(rows) {
      if (rows.length === 0) throw new Error("CSV is empty.");
      const [headers, ...records] = rows;
      if (headers.length === 0 || headers.some((header) => header.length === 0)) {
        throw new Error("CSV header is missing or invalid.");
      }
      if (records.some((record) => record.length !== headers.length)) {
        throw new Error("CSV rows do not have the same number of columns as the header.");
      }
      csvHeaders = headers;
      csvRecords = records;

      const tableHead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      const selectionHeader = document.createElement("th");
      selectionHeader.className = "select-column";
      selectionHeader.scope = "col";
      const selectAllLabel = document.createElement("label");
      selectAllLabel.className = "select-all-control";
      const selectAllCheckbox = document.createElement("input");
      selectAllCheckbox.type = "checkbox";
      selectAllCheckbox.id = "selectAllRecords";
      selectAllCheckbox.disabled = records.length === 0;
      selectAllCheckbox.setAttribute("aria-label", "Select all records");
      selectAllCheckbox.addEventListener("change", () => selectAllRecords(selectAllCheckbox));
      const selectAllText = document.createElement("span");
      selectAllText.textContent = "Select";
      selectAllLabel.append(selectAllCheckbox, selectAllText);
      selectionHeader.append(selectAllLabel);
      headerRow.append(selectionHeader);
      for (const header of headers) {
        const cell = document.createElement("th");
        cell.scope = "col";
        cell.textContent = header;
        headerRow.append(cell);
      }
      tableHead.append(headerRow);

      const tableBody = document.createElement("tbody");
      records.forEach((record, index) => {
        const tableRow = document.createElement("tr");
        tableRow.dataset.recordIndex = String(index);
        tableRow.setAttribute("aria-selected", "false");

        const selectionCell = document.createElement("td");
        selectionCell.className = "select-column";
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = `selectedCsvRecord-${index}`;
        radio.value = String(index);
        radio.setAttribute("aria-label", `Select record ${index + 1}`);
        radio.addEventListener("change", () => selectRecord(index, tableRow, radio));
        selectionCell.append(radio);
        tableRow.append(selectionCell);

        for (const value of record) {
          const cell = document.createElement("td");
          cell.textContent = value;
          tableRow.append(cell);
        }
        tableRow.addEventListener("click", (event) => {
          if (event.target !== radio) selectRecord(index, tableRow, radio);
        });
        tableBody.append(tableRow);
      });

      csvTable.replaceChildren(tableHead, tableBody);
      csvTableContainer.hidden = false;
      return records.length;
    }

    function showCsv(text, byteLength) {
      csvContents = text;
      downloadButton.disabled = false;

      try {
        const rows = parseCsv(text);
        const recordCount = renderCsvTable(rows);
        fileMeta.textContent = `${(recordCount + 1).toLocaleString()} lines · ${recordCount.toLocaleString()} records · ${byteLength.toLocaleString()} bytes`;
      } catch (error) {
        csvTable.replaceChildren();
        csvTableContainer.hidden = true;
        spectrumPanel.hidden = true;
        setStatus(`The CSV cannot be displayed as a table: ${error.message} You can still download the received file.`, "error");
        fileMeta.textContent = `${byteLength.toLocaleString()} bytes received; invalid CSV format for row display.`;
      }
    }

    function failTransfer(message) {
      clearTransfer();
      setStatus(message, "error");
      connectButton.disabled = !device || !device.gatt.connected;
      disconnectButton.disabled = !device || !device.gatt.connected;
      updateActionButtons();
    }

    function handleDataNotification(event) {
      if (!transferPending) return;

      const value = event.target.value;
      const chunk = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
      transferChunks.push(new Uint8Array(chunk));
      receivedBytes += chunk.byteLength;
    }

    function finishTransfer(expectedBytes) {
      if (receivedBytes !== expectedBytes) {
        failTransfer(`CSV transfer incomplete: expected ${expectedBytes} bytes, received ${receivedBytes}.`);
        return;
      }

      const bytes = new Uint8Array(receivedBytes);
      let offset = 0;
      for (const chunk of transferChunks) {
        bytes.set(chunk, offset);
        offset += chunk.byteLength;
      }

      try {
        const text = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
        showCsv(text, receivedBytes);
        clearTransfer();
        requestButton.disabled = false;
        setStatus(`CSV received and verified (${expectedBytes.toLocaleString()} bytes).`, "success");
      } catch (error) {
        failTransfer(`The received file is not valid UTF-8: ${error.message}`);
      }
    }

    function handleStatusNotification(event) {
      const message = new TextDecoder().decode(event.target.value).trim();
      if (message === "READY") {
        setStatus(device?.gatt.connected ? "Connected. Ready to receive the CSV." : "Ready to connect.");
        return;
      }

      const versionMatch = /^VERSION:(.+)$/.exec(message);
      if (versionMatch) {
        versionBadge.textContent = `v${versionMatch[1]}`;
        return;
      }

      if (message === "BUSY") {
        if (!transferPending) {
          transferChunks = [];
          receivedBytes = 0;
          transferPending = true;
          transferTimer = setTimeout(() => {
            failTransfer("Timed out while waiting for the CSV transfer to finish.");
          }, TRANSFER_TIMEOUT_MS);
        }
        setStatus("Receiving CSV from the spectrometer…", "working");
        return;
      }

      const doneMatch = /^DONE:(\d+)$/.exec(message);
      if (doneMatch) {
        if (!transferPending) {
          failTransfer("The device completed a transfer that was not requested.");
          return;
        }
        finishTransfer(Number(doneMatch[1]));
        return;
      }

      if (message === "DELETED") {
        if (!deletePending) {
          setStatus("Received an unexpected delete confirmation.", "error");
          return;
        }
        clearTimeout(deleteTimer);
        deleteTimer = null;
        deletePending = false;
        setStatus("Record deleted. Refreshing the CSV…", "working");
        requestCsv();
        return;
      }

      if (message === "CSV_CLEARED") {
        if (!deletePending) {
          setStatus("Received an unexpected CSV clear confirmation.", "error");
          return;
        }
        clearTimeout(deleteTimer);
        deleteTimer = null;
        deletePending = false;
        setStatus("CSV cleared. Refreshing the file…", "working");
        requestCsv();
        return;
      }

      if (message.startsWith("ERROR:")) {
        const errors = {
          "ERROR:OPEN": "The device could not open /data.csv.",
          "ERROR:READ": "The device failed while reading /data.csv.",
          "ERROR:COMMAND": "The device rejected the CSV request.",
          "ERROR:BUSY": "The device is busy; reconnect and try again.",
          "ERROR:DELETE": "The device could not delete the selected row.",
          "ERROR:CLEAR": "The device could not clear the CSV. Check the serial log for details.",
          "ERROR:NOT_FOUND": "The selected CSV row no longer exists. Get the CSV again.",
          "ERROR:STALE": "The CSV changed after it was loaded. Get it again before deleting."
        };
        const errorMessage = errors[message] ?? `BLE operation failed (${message}).`;
        if (deletePending) {
          clearTimeout(deleteTimer);
          deleteTimer = null;
          deletePending = false;
          if (message === "ERROR:NOT_FOUND" || message === "ERROR:STALE") {
            clearSelection();
          } else {
            updateActionButtons();
          }
          setStatus(errorMessage, "error");
          return;
        }
        failTransfer(errorMessage);
      }
    }

    function handleDisconnect() {
      clearTransfer();
      clearTimeout(deleteTimer);
      deleteTimer = null;
      deletePending = false;
      controlCharacteristic = null;
      dataCharacteristic = null;
      statusCharacteristic = null;
      connectButton.disabled = false;
      disconnectButton.disabled = true;
      updateActionButtons();
      setStatus("Device disconnected. The received CSV remains available.");
    }

    async function connect() {
      if (!navigator.bluetooth) {
        setStatus("Web Bluetooth is unavailable. Use a supported browser on localhost or HTTPS.", "error");
        return;
      }

      connectButton.disabled = true;
      setStatus("Choose the AS7265x CSV device in the Bluetooth picker…", "working");

      try {
        device = await navigator.bluetooth.requestDevice({
          filters: [{ name: DEVICE_NAME }],
          optionalServices: [SERVICE_UUID]
        });
        device.addEventListener("gattserverdisconnected", handleDisconnect);

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        controlCharacteristic = await service.getCharacteristic(CONTROL_UUID);
        dataCharacteristic = await service.getCharacteristic(DATA_UUID);
        statusCharacteristic = await service.getCharacteristic(STATUS_UUID);

        dataCharacteristic.addEventListener("characteristicvaluechanged", handleDataNotification);
        statusCharacteristic.addEventListener("characteristicvaluechanged", handleStatusNotification);
        await dataCharacteristic.startNotifications();
        await statusCharacteristic.startNotifications();
        versionBadge.textContent = "v—";

        connectButton.disabled = true;
        disconnectButton.disabled = false;
        updateActionButtons();
        setStatus("Connected. Ready to receive the CSV.", "success");
        await controlCharacteristic.writeValueWithResponse(
          new TextEncoder().encode("GET_VERSION")
        );
      } catch (error) {
        if (device?.gatt.connected) device.gatt.disconnect();
        clearTransfer();
        controlCharacteristic = null;
        dataCharacteristic = null;
        statusCharacteristic = null;
        connectButton.disabled = false;
        disconnectButton.disabled = true;
        updateActionButtons();
        setStatus(error.name === "NotFoundError"
          ? "No device selected."
          : `Could not connect: ${error.message}`, "error");
      }
    }

    async function requestCsv() {
      if (!controlCharacteristic || !device?.gatt.connected) {
        setStatus("Connect to the spectrometer before requesting the CSV.", "error");
        return;
      }
      if (transferPending || deletePending) return;

      clearSelection();
      csvContents = null;
      downloadButton.disabled = true;
      csvHeaders = [];
      csvRecords = [];
      csvTable.replaceChildren();
      csvTableContainer.hidden = true;
      spectrumPanel.hidden = true;
      fileMeta.textContent = "Waiting for the device…";
      transferChunks = [];
      receivedBytes = 0;
      transferPending = true;
      updateActionButtons();
      transferTimer = setTimeout(() => {
        failTransfer("Timed out while waiting for the device to start the CSV transfer.");
      }, TRANSFER_TIMEOUT_MS);
      setStatus("Requesting CSV…", "working");

      try {
        await controlCharacteristic.writeValueWithResponse(
          new TextEncoder().encode("GET_CSV")
        );
      } catch (error) {
        failTransfer(`Could not request the CSV: ${error.message}`);
      }
    }

    function failDelete(message) {
      clearTimeout(deleteTimer);
      deleteTimer = null;
      deletePending = false;
      updateActionButtons();
      setStatus(message, "error");
    }

    async function deleteSelectedRow() {
      if (!controlCharacteristic || !device?.gatt.connected) {
        setStatus("Connect to the spectrometer before deleting a row.", "error");
        return;
      }
      if (deletePending) return;
      if (selectedAllRecords) {
        const confirmed = await confirmDestructiveAction(
          "Delete all records?",
          `This permanently removes all ${csvRecords.length} records from the spectrometer. The CSV header will be kept so new measurements can be logged.`,
          "Delete all"
        );
        if (!confirmed) return;

        deletePending = true;
        updateActionButtons();
        setStatus("Clearing all CSV records on the spectrometer…", "working");
        deleteTimer = setTimeout(() => {
          failDelete("Timed out waiting for the spectrometer to confirm the CSV clear.");
        }, TRANSFER_TIMEOUT_MS);

        try {
          await controlCharacteristic.writeValueWithResponse(
            new TextEncoder().encode("CLEAR_CSV")
          );
        } catch (error) {
          failDelete(`Could not clear the CSV: ${error.message}`);
        }
        return;
      }
      if (selectedRecordIndex === null || selectedSampleId === null) {
        setStatus("Select a valid CSV row before deleting it.", "error");
        return;
      }

      const labelColumn = csvHeaders.findIndex(
        (header) => header.toLowerCase() === "label"
      );
      const label = labelColumn < 0 ? "" : csvRecords[selectedRecordIndex][labelColumn];
      const description = label ? ` (${label})` : "";
      const confirmed = await confirmDestructiveAction(
        "Delete selected record?",
        `Permanently delete record ${selectedRecordIndex + 1}${description} from the spectrometer?`,
        "Delete record"
      );
      if (!confirmed) return;

      const command = new TextEncoder().encode(
        `D,${selectedRecordIndex},${selectedSampleId}`
      );
      if (command.byteLength > 20) {
        setStatus("The delete command exceeds the BLE write limit.", "error");
        return;
      }

      deletePending = true;
      updateActionButtons();
      setStatus("Deleting the selected row from the spectrometer…", "working");
      deleteTimer = setTimeout(() => {
        failDelete("Timed out waiting for the spectrometer to confirm the deletion.");
      }, TRANSFER_TIMEOUT_MS);

      try {
        await controlCharacteristic.writeValueWithResponse(command);
      } catch (error) {
        failDelete(`Could not delete the selected row: ${error.message}`);
      }
    }

    function disconnect() {
      if (device?.gatt.connected) device.gatt.disconnect();
    }

    function downloadCsv() {
      if (csvContents === null) return;

      const blob = new Blob([csvContents], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "data.csv";
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    connectButton.addEventListener("click", connect);
    requestButton.addEventListener("click", requestCsv);
    downloadButton.addEventListener("click", downloadCsv);
    disconnectButton.addEventListener("click", disconnect);
    deleteRowButton.addEventListener("click", deleteSelectedRow);
    confirmationDialog.addEventListener("click", (event) => {
      if (event.target === confirmationDialog) confirmationDialog.close("cancel");
    });
  </script>
</body>
</html>
